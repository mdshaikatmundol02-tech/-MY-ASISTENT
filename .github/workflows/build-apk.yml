      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Generate temporary debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -keypass android \
            -storepass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="debug-v${{ github.run_number }}.${{ github.run_attempt }}"
          TITLE="Debug APK - Run ${{ github.run_number }} (Attempt ${{ github.run_attempt }})"

          NOTES=$(printf '%s\n' \
            '### Release Notes' \
            '● This is an automatically generated debug APK.' \
            '● The APK was built by GitHub Actions.' \
            '● The GitHub Actions run number: ${{ github.run_number }}' \
            '● The GitHub Actions run attempt: ${{ github.run_attempt }}' \
            '● The source commit SHA: ${{ github.sha }}' \
            '● The APK is intended for testing.' \
            '● The APK is not a Play Store production release.' \
            '● The APK is signed only with a temporary debug keystore.')

          gh release create "$TAG" \
            app/build/outputs/apk/debug/app-debug.apk \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="debug-v${{ github.run_number }}.${{ github.run_attempt }}"
          APK_FILE="app-debug.apk"

          echo "=========================================="
          echo "       APK BUILD & RELEASE SUMMARY        "
          echo "=========================================="

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Status: Release publishing succeeded"
            echo "Confirming release with gh release view..."
            gh release view "$TAG"

            RELEASE_URL=$(gh release view "$TAG" --json url -q .url 2>/dev/null || echo "https://github.com/${{ github.repository }}/releases/tag/$TAG")

            echo "Release Tag: $TAG"
            echo "Release Title: Debug APK - Run ${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
            echo "Direct GitHub Release page URL: $RELEASE_URL"
            echo "Exact APK asset filename: $APK_FILE"

            {
              echo "## 🚀 Android Debug APK Released Successfully"
              echo ""
              echo "- **Release Tag:** \`$TAG\`"
              echo "- **Release Title:** Debug APK - Run ${{ github.run_number }} (Attempt ${{ github.run_attempt }})"
              echo "- **Direct Release URL:** [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset Filename:** \`$APK_FILE\`"
              echo ""
              echo "### Download Information"
              echo "- The APK can be downloaded directly from the **Assets** section of the [GitHub Release Page]($RELEASE_URL)."
              echo "- The normal Actions artifact named \`app-debug-apk\` is also available as a backup from the Actions workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed, but APK build succeeded."
            echo "APK build status: Succeeded"
            echo "Actions artifact named app-debug-apk remains available."

            {
              echo "## ⚠️ Release Publishing Warning"
              echo ""
              echo "> **Warning:** GitHub Release publishing did not succeed, but the APK build succeeded."
              echo ""
              echo "- **APK Build Status:** Succeeded"
              echo "- **Backup Artifact:** The Actions artifact named \`app-debug-apk\` remains available."
              echo "- **Download Location:** You can download \`app-debug-apk\` directly from the summary of this GitHub Actions run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
